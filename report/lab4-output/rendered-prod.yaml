apiVersion: v1
kind: ConfigMap
metadata:
  name: shelf-boardgame-shelf-frontend-nginx
  namespace: boardgame-prod
  labels:
    helm.sh/chart: boardgame-shelf-0.1.0
    app.kubernetes.io/name: boardgame-shelf
    app.kubernetes.io/instance: shelf
