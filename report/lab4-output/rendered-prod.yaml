# Source: boardgame-shelf/templates/tests/test-app.yaml
apiVersion: v1
kind: Pod
metadata:
  name: shelf-boardgame-shelf-test
  namespace: boardgame-prod
  labels:
    helm.sh/chart: boardgame-shelf-0.1.0
    app.kubernetes.io/name: boardgame-shelf
    app.kubernetes.io/instance: shelf
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: boardgame-shelf
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: "busybox:1.36"
      command:
        - sh
        - -c
        - |
          set -e
          FRONT="http://shelf-boardgame-shelf-frontend:80"
          echo "1) frontend /healthz";  wget -qO- -T 5 "$FRONT/healthz"
          echo "2) backend /api/ready (через nginx)"; wget -qO- -T 5 "$FRONT/api/ready"; echo
          echo "3) /api/info";          info=$(wget -qO- -T 5 "$FRONT/api/info"); echo "$info"
          echo "$info" | grep -q '"dbPasswordSet":true' || { echo "FAIL: DB password not set"; exit 1; }
          echo "$info" | grep -q '"version":"1.1.0"' || { echo "FAIL: expected version 1.1.0"; exit 1; }
          echo "4) /api/games";         wget -qO- -T 5 "$FRONT/api/games" > /dev/null
          echo "OK: release shelf works, backend version 1.1.0"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
