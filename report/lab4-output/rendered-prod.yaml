# Source: boardgame-shelf/templates/postgres-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelf-boardgame-shelf-postgres
  namespace: boardgame-prod
  labels:
    helm.sh/chart: boardgame-shelf-0.1.0
    app.kubernetes.io/name: boardgame-shelf
    app.kubernetes.io/instance: shelf
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: boardgame-shelf
    app.kubernetes.io/component: database
spec:
  # 0 або 1: том ReadWriteOnce; Recreate — два сервери не пишуть в один каталог
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: boardgame-shelf
      app.kubernetes.io/instance: shelf
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        helm.sh/chart: boardgame-shelf-0.1.0
        app.kubernetes.io/name: boardgame-shelf
        app.kubernetes.io/instance: shelf
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: boardgame-shelf
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: shelf-boardgame-shelf-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shelf-boardgame-shelf-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shelf-boardgame-shelf-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shelf-boardgame-shelf-postgres-data
