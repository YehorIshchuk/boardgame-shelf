# Source: boardgame-shelf/templates/hooks/pre-upgrade-db-check.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: shelf-boardgame-shelf-pre-upgrade
  namespace: boardgame-prod
  labels:
    helm.sh/chart: boardgame-shelf-0.1.0
    app.kubernetes.io/name: boardgame-shelf
    app.kubernetes.io/instance: shelf
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: boardgame-shelf
    app.kubernetes.io/component: pre-upgrade-hook
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boardgame-shelf
        app.kubernetes.io/instance: shelf
        app.kubernetes.io/component: pre-upgrade-hook
    spec:
      restartPolicy: Never
      containers:
        - name: db-check
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: "shelf-boardgame-shelf-postgres"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "boardgames"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: shelf-boardgame-shelf-db
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: shelf-boardgame-shelf-db
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              echo "[pre-upgrade] release=shelf revision=1 -> checking $PGHOST:$PGPORT/$PGDATABASE"
              pg_isready -t 15 || { echo "[pre-upgrade] database is NOT ready, upgrade aborted"; exit 1; }
              games=$(psql -tAc 'SELECT count(*) FROM "Games"' 2>/dev/null || echo "n/a")
              echo "[pre-upgrade] database OK, games in DB: $games"
              sleep 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
