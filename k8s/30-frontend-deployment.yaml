# React-збірка, яку віддає nginx; nginx також проксіює /api/ на Service backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: boardgame-shelf
  labels:
    app.kubernetes.io/name: boardgame-shelf
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: boardgame-shelf
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: boardgame-shelf
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boardgame-shelf
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: boardgame-shelf
    spec:
      containers:
        - name: frontend
          image: ghcr.io/yehorishchuk/boardgame-shelf-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
