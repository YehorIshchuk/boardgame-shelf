# PostgreSQL: одна репліка (том ReadWriteOnce), стратегія Recreate —
# старий под зупиняється до старту нового, щоб два сервери не писали в один каталог.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: boardgame-shelf
  labels:
    app.kubernetes.io/name: boardgame-shelf
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: boardgame-shelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: boardgame-shelf
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boardgame-shelf
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: boardgame-shelf
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: boardgame-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: boardgame-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: boardgame-db-secret
                  key: POSTGRES_PASSWORD
            # підкаталог, бо корінь тому може містити lost+found
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
