{{- /* Значення беруться зі значень чарта (database.auth), у шаблоні їх немає.
       Якщо задано database.auth.existingSecret — Secret створено поза чартом. */ -}}
{{- if not .Values.database.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boardgame-shelf.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boardgame-shelf.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.database.auth.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ include "boardgame-shelf.dbPassword" . | b64enc | quote }}
{{- end }}
