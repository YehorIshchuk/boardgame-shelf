{{- /*
Конфігурація nginx для frontend. В образі адреса API прописана як http://backend:8080,
а в чарті ім'я Service backend залежить від імені релізу — тому конфіг генерується тут
і монтується поверх файлу з образу.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "boardgame-shelf.frontendName" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boardgame-shelf.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location /api/ {
        proxy_pass http://{{ include "boardgame-shelf.backendName" . }}:{{ .Values.backend.service.port }};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }

      location / {
        try_files $uri /index.html;
      }
    }
