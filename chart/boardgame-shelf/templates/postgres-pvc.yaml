{{- if .Values.database.persistence.enabled }}
{{- $pvcName := printf "%s-data" (include "boardgame-shelf.postgresName" .) }}
{{- /*
Розмір PVC після створення змінювати не можна, якщо StorageClass не підтримує розширення
(як standard у minikube). Тому при оновленні релізу зберігаємо поточний розмір,
якщо явно не дозволено resize (database.persistence.allowResize).
*/}}
{{- $existing := lookup "v1" "PersistentVolumeClaim" .Release.Namespace $pvcName }}
{{- $size := .Values.database.persistence.size }}
{{- if and $existing (not .Values.database.persistence.allowResize) }}
{{- $size = $existing.spec.resources.requests.storage }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvcName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boardgame-shelf.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  {{- if .Values.database.persistence.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.database.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $size }}
{{- end }}
