apiVersion: v1
kind: Service
metadata:
  name: {{ include "boardgame-shelf.postgresName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boardgame-shelf.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    {{- include "boardgame-shelf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: {{ .Values.database.service.port }}
      targetPort: postgres
