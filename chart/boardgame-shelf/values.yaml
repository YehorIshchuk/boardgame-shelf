# Значення за замовчуванням відповідають середовищу розробки (dev).
# Для prod — values-prod.yaml, для явного dev — values-dev.yaml.

# Перевизначення імен об'єктів (зазвичай не потрібні).
nameOverride: ""
fullnameOverride: ""

# Спільні параметри образів застосунку
image:
  registry: ghcr.io/yehorishchuk
  pullPolicy: IfNotPresent
  # спільний тег для backend і frontend; порожньо -> appVersion з Chart.yaml.
  # Тег компонента (backend.image.tag / frontend.image.tag) має пріоритет над цим.
  tag: ""

# Скільки секунд Deployment може не просуватися, перш ніж стати Failed/Degraded
# (у Kubernetes за замовчуванням 600)
progressDeadlineSeconds: 600

# Стратегія оновлення backend і frontend (оновлення без простою)
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

# Параметри застосунку -> ConfigMap (змінні оточення backend)
config:
  aspnetEnvironment: Development
  clubName: "Кубик і Ко (dev)"
  maxBorrowDays: 14
  logLevel: Debug

# PostgreSQL
database:
  # лише 0 або 1: PostgreSQL з томом ReadWriteOnce не масштабується горизонтально
  replicaCount: 1
  name: boardgames
  auth:
    username: shelf_app
    # Навчальне значення лише для dev. Якщо залишити порожнім, чарт згенерує
    # випадковий пароль при першому встановленні і збереже його при оновленнях.
    password: "dev-only-not-a-secret"
    # Ім'я вже створеного Secret з ключами POSTGRES_USER і POSTGRES_PASSWORD.
    # Якщо задано — чарт не створює власний Secret (так паролі не потрапляють у Git;
    # потрібно для Argo CD, де функція lookup не працює).
    existingSecret: ""
  image:
    repository: postgres
    tag: "16-alpine"
  # Додаткові параметри рядка підключення Npgsql.
  # Pooling=false: після перезапуску PostgreSQL з'єднання в пулі backend стають «мертвими»,
  # і перший запит повертав 500. Для невеликого застосунку простіше вимкнути пул.
  connectionOptions: "Pooling=false"
  service:
    port: 5432
  persistence:
    # false -> дані в emptyDir (зникають разом з подом)
    enabled: true
    size: 1Gi
    # порожньо -> StorageClass кластера за замовчуванням
    storageClass: ""
    # true -> PVC не видаляється при helm uninstall (helm.sh/resource-policy: keep)
    keep: false
    # false -> при оновленні релізу розмір існуючого PVC не змінюється
    # (StorageClass standard у minikube не підтримує розширення томів)
    allowResize: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ASP.NET Core API
backend:
  replicaCount: 1
  image:
    repository: boardgame-shelf-backend
    # порожньо -> appVersion з Chart.yaml
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

# React + nginx
frontend:
  replicaCount: 1
  image:
    repository: boardgame-shelf-frontend
    # порожньо -> appVersion з Chart.yaml
    tag: ""
  service:
    type: NodePort
    port: 80
    # порожньо -> Kubernetes обирає вільний порт (дозволяє ставити чарт двічі)
    nodePort: ""
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

# Ingress (потрібен minikube addons enable ingress)
ingress:
  enabled: false
  className: nginx
  host: boardgames-dev.local
  annotations: {}

# Хук pre-upgrade: перевірка доступності БД перед оновленням релізу
hooks:
  preUpgradeDbCheck:
    enabled: true

# Тест релізу (helm test)
tests:
  enabled: true
  image: busybox:1.36
